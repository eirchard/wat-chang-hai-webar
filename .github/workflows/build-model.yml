name: Build demo 3D model
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_model.py'
      - '.github/workflows/build-model.yml'
permissions:
  contents: write
jobs:
  generate-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy trimesh
      - run: python tools/build_model.py
      - name: Commit generated GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wat-chang-hai-stupa.glb
          git diff --cached --quiet || (git commit -m "Build demo 3D model" && git push)
